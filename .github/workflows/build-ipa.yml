name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Install CocoaPods
        run: |
          pod install || pod install --repo-update || true

      - name: Build Xcode Project
        run: |
          # Projekt/Workspace dynamisch über das gesamte Repo finden
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          PROJECT=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          
          if [ -n "$WORKSPACE" ]; then
            TARGET_SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | xargs | awk '{print $1}')
            xcodebuild -workspace "$WORKSPACE" -scheme "$TARGET_SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          elif [ -n "$PROJECT" ]; then
            TARGET_SCHEME=$(xcodebuild -project "$PROJECT" -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | xargs | awk '{print $1}')
            xcodebuild -project "$PROJECT" -scheme "$TARGET_SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            echo "Kein Xcode-Projekt gefunden!"
            exit 1
          fi

      - name: Zip Payload to IPA
        run: |
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SegwayWorld.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SegwayWorld-IPA
          path: SegwayWorld.ipa
